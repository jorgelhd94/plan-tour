  :root {
    --bg: #0f1726; --card: #19253a; --card-2: #213049; --line: #34465f;
    --text: #edf2f8; --text-2: #b9c5d6; --muted: #7d8ca3;
    --flow: #6cc4de; --bad: #ff7d6e; --good: #5fd39a; --warn: #f3c15b;
    --sans: "Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "Plex Mono", Consolas, "Cascadia Mono", monospace;
    --ease: cubic-bezier(.2, .75, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }
  :focus-visible { outline: 2px solid var(--flow); outline-offset: 3px; border-radius: 6px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 20px; padding: 20px clamp(20px, 3vw, 48px) 0; z-index: 3; }
  .chapter { font-size: 15px; color: var(--text-2); font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chapter span { color: var(--muted); font-weight: 400; margin-right: 10px; font-variant-numeric: tabular-nums; }
  .track { display: flex; gap: 5px; margin-left: auto; width: min(360px, 40vw); height: 4px; flex: none; }
  .seg { flex: 1; border-radius: 2px; background: var(--line); overflow: hidden; }
  .seg.pending { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .seg i { display: block; height: 100%; background: var(--text-2); transform-origin: left; transform: scaleX(0); }
  .seg.current i { background: var(--flow); }

  /* ---------- stage ---------- */
  #stage { position: relative; overflow: hidden; min-height: 0;
    background-image: radial-gradient(rgba(150, 175, 210, .09) 1.2px, transparent 1.3px); background-size: 28px 28px; }
  #host { position: absolute; inset: 0; }
  #stage.leaving #host { opacity: 0; transition: opacity .25s; }

  .plan { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 46vw); z-index: 6; background: #131d2f;

  .plan-head { display: flex; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .plan-head strong { font-size: 16px; font-weight: 600; }
  .plan-head span { font-size: 14px; color: var(--muted); margin-right: auto; }
  .plan-head button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
    color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
  .plan-head button:hover { background: var(--card); color: var(--text); }
  .plan-body { overflow: auto; padding: 8px 32px 64px; font-size: 16.5px; line-height: 1.65; color: var(--text-2); }
  .plan-body h1, .plan-body h2, .plan-body h3, .plan-body h4 { color: var(--text); line-height: 1.25; letter-spacing: -.01em; margin: 1.6em 0 .5em; scroll-margin-top: 16px; }
  .plan-body h1 { font-size: 28px; } .plan-body h2 { font-size: 22px; } .plan-body h3 { font-size: 18px; } .plan-body h4 { font-size: 16px; }
  .plan-body p, .plan-body ul, .plan-body ol, .plan-body table, .plan-body pre, .plan-body blockquote { margin: 0 0 1em; }
  .plan-body ul, .plan-body ol { padding-left: 1.4em; }
  .plan-body li { margin: .25em 0; }
  .plan-body a { color: var(--flow); }
  .plan-body strong { color: var(--text); }
  .plan-body code { font-family: var(--mono); font-size: .88em; background: #1c2a41; padding: .12em .4em; border-radius: 5px; color: #d6e2f0; }
  .plan-body pre { background: #0f1828; border-radius: 10px; padding: 14px 16px; overflow: auto; box-shadow: inset 0 0 0 1px var(--line); }
  .plan-body pre code { background: none; padding: 0; font-size: 14px; line-height: 1.55; }
  .plan-body table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
  .plan-body th, .plan-body td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .plan-body th { color: var(--text); font-weight: 600; }
  .plan-body blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); }
  .plan-body hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  .plan-body .here { position: relative; }
  .plan-body .here::before { content: ""; position: absolute; left: -18px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--flow); }
  .plan-body h1.here, .plan-body h2.here, .plan-body h3.here, .plan-body h4.here { color: var(--flow); }
  .plan-empty { color: var(--muted); padding: 24px 0; }
  body.plan-open #stage, body.plan-open footer, body.plan-open header { margin-right: min(620px, 46vw); }
  #stage, footer, header { transition: margin .45s var(--ease); }

  .intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(10, 16, 28, .88); backdrop-filter: blur(6px); }
  .intro-card { width: min(520px, calc(100% - 32px)); padding: 40px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .intro-card h2 { margin: 0 0 12px; font-size: 32px; letter-spacing: -.02em; }
  .intro-card p { margin: 0 0 28px; color: var(--text-2); font-size: 17px; line-height: 1.55; }
  .intro-card button { font: 600 17px var(--sans); padding: 14px 26px; border-radius: 12px; border: 0; cursor: pointer; background: var(--flow); color: #06222c; }
  .hidden { display: none !important; }

  /* ---------- review mode (contact sheet) ---------- */
  body.review { display: block; height: auto; overflow: auto; background: #0b111d; }
  body.review header, body.review footer, body.review #stage, body.review .intro, body.review .plan { display: none !important; }
  #sheet { display: grid; grid-template-columns: repeat(2, 800px); gap: 18px; padding: 18px; }
  #sheet figure { margin: 0; }
  #sheet .frame { position: relative; width: 800px; height: 450px; overflow: hidden; background: var(--bg); border-radius: 8px;
    background-image: radial-gradient(rgba(150, 175, 210, .09) 1.2px, transparent 1.3px); background-size: 14px 14px; }
  #sheet figcaption { font-size: 15px; color: var(--text-2); padding: 8px 2px 0; line-height: 1.35; }
  #sheet figcaption b { color: var(--flow); margin-right: 6px; }

  @media (max-width: 800px) {
    footer { grid-template-columns: 1fr; }
    .caption, .controls { grid-column: 1; justify-self: center; max-width: 100%; }
    .plan { width: 100%; } body.plan-open #stage, body.plan-open footer, body.plan-open header { margin-right: 0; }
  }
</style>

<footer>

  </div>
</footer>

    const anim = el.animate(pts.map(p => ({ translate: `${p.x}px ${p.y}px` })), { duration: spec.ms || 1400, easing: "cubic-bezier(.45,.05,.3,1)", fill: "forwards" });

function setProps(view, spec, animate) {

    asList(spec.remove).forEach(c => String(c).split(/\s+/).filter(Boolean).forEach(x => el.classList.remove(x)));
    asList(spec.add).forEach(c => String(c).split(/\s+/).filter(Boolean).forEach(x => el.classList.add(x)));
    if (spec.attr) for (const [k, v] of Object.entries(spec.attr)) v === null ? el.removeAttribute(k) : el.setAttribute(k, v);
    if (spec.style) Object.assign(el.style, spec.style);
    if ("text" in spec) {
      const target = el.querySelector("[data-text]") || el.querySelector(".t") || el;
      const apply = () => { if (target === el && el.children.length && !(el instanceof SVGElement)) { const last = [...el.childNodes].reverse().find(n => n.nodeType === 3 && n.textContent.trim()); if (last) last.textContent = spec.text; else el.append(spec.text); } else target.textContent = spec.text; };

// Focus works with any markup: everything around the focused elements dims, at every level up to the canvas
const SKIP = /^(style|defs|marker|script|title|desc|lineargradient|radialgradient|clippath|mask|symbol)$/i;
function setFocus(view, sels) {
  view.canvas.querySelectorAll(".focus, .dimmed").forEach(e => e.classList.remove("focus", "dimmed"));
  const targets = asList(sels).flatMap(s => q(view, s));
  view.canvas.classList.toggle("focusing", targets.length > 0);
  if (!targets.length) return;
  targets.forEach(e => e.classList.add("focus"));
  for (const el of targets) {
    for (let n = el; n && n !== view.canvas && n.parentElement; n = n.parentElement) {
      for (const sib of n.parentElement.children) {
        if (sib === n || SKIP.test(sib.tagName) || sib.hasAttribute("data-pre")) continue;
        sib.classList.add("dimmed");
      }
      if (n.parentElement === view.canvas) break;
    }
  }
  // never dim a focused element, something inside one, or a container of one
  view.canvas.querySelectorAll(".dimmed").forEach(d => {
    if (d.classList.contains("focus") || d.closest(".focus") || targets.some(t => d.contains(t))) d.classList.remove("dimmed");

function setLines(view, spec) {
  // spec: { sel: ".code" (optional), lines: [130, "132-133"] }
  const codes = spec.sel ? q(view, spec.sel) : q(view, ".code");
  const set = new Set(expandLines(asList(spec.lines)));
  codes.forEach(code => {
    code.classList.toggle("focusing", set.size > 0);
    code.querySelectorAll(".ln").forEach(l => l.classList.toggle("hl", set.has(+l.dataset.n)));
  });
}

function applyCamera(view, target, instant = false) {
  view.cam = target ?? null;
  const { s: base, w, h } = view.fit;
  let s = base, tx = (w - W * base) / 2, ty = (h - H * base) / 2;
  const sels = target == null || target === "all" ? [] : asList(target);
  if (sels.length) {
    const prev = view.canvas.style.transform;
    view.canvas.style.transition = "none";
    view.canvas.style.transform = `translate(0px,0px) scale(${base})`;
    view.camScale = base;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    sels.forEach(sel => q(view, sel).forEach(el => {
      const c = centerOf(view, el);
      x1 = Math.min(x1, c.x - c.w / 2); x2 = Math.max(x2, c.x + c.w / 2);
      y1 = Math.min(y1, c.y - c.h / 2); y2 = Math.max(y2, c.y + c.h / 2);
    }));
    // other visible elements, to avoid leaving any of them cut in half at the frame's edge
    const others = [...view.canvas.querySelectorAll("[data-el], .box, .card, .pill, .note, .code, .chip")]
      .filter(el => !el.closest("[data-pre]") && el.getClientRects().length)
      .map(el => { const c = centerOf(view, el); return { x1: c.x - c.w / 2, x2: c.x + c.w / 2, y1: c.y - c.h / 2, y2: c.y + c.h / 2 }; });
    view.canvas.style.transform = prev; void view.canvas.getBoundingClientRect(); view.canvas.style.transition = "";
    if (isFinite(x1)) {
      const pad = 90;
      const solve = () => {
        const bw = x2 - x1 + pad * 2, bh = y2 - y1 + pad * 2;
        s = Math.max(base, Math.min(base * 2.2, w / bw, h / bh));
        tx = w / 2 - s * (x1 + x2) / 2; ty = h / 2 - s * (y1 + y2) / 2;
      };
      solve();
      for (let pass = 0; pass < 3; pass++) {
        let grew = false;
        for (const o of others) {
          const sx1 = tx + s * o.x1, sx2 = tx + s * o.x2, sy1 = ty + s * o.y1, sy2 = ty + s * o.y2;
          const inside = sx1 >= 0 && sx2 <= w && sy1 >= 0 && sy2 <= h, outside = sx2 <= 0 || sx1 >= w || sy2 <= 0 || sy1 >= h;
          if (!inside && !outside) { x1 = Math.min(x1, o.x1); x2 = Math.max(x2, o.x2); y1 = Math.min(y1, o.y1); y2 = Math.max(y2, o.y2); grew = true; }
        }
        if (!grew) break;
        solve();
      }
      // don't show empty space beyond the canvas edges when zoomed in
      tx = W * s >= w ? Math.min(0, Math.max(w - W * s, tx)) : (w - W * s) / 2;
      ty = H * s >= h ? Math.min(0, Math.max(h - H * s, ty)) : (h - H * s) / 2;
    }
  }
  view.camScale = s;
  if (instant || view.isStatic) { view.canvas.style.transition = "none"; }
  view.canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  if (instant || view.isStatic) { void view.canvas.getBoundingClientRect(); view.canvas.style.transition = ""; }
}

async function applyStep(view, sceneDiv, scene, i, animate) {
  const st = scene.steps[i] || {};
  const n = i + 1;
  sceneDiv.querySelectorAll(`[data-step="${n}"]`).forEach(el => reveal(el, animate));
  view.canvas.querySelectorAll(`[data-hide="${n}"]`).forEach(el => { if (el.closest(".scene") === sceneDiv) hideEl(el, animate); });
  asList(st.show).forEach(sel => q(view, sel).forEach(el => reveal(el, animate)));
  asList(st.hide).forEach(sel => q(view, sel).forEach(el => hideEl(el, animate)));
  asList(st.set).forEach(spec => setProps(view, spec, animate));
  if ("focus" in st) setFocus(view, st.focus);
  if (st.lines) setLines(view, Array.isArray(st.lines) ? { lines: st.lines } : st.lines);
  if ("camera" in st) applyCamera(view, st.camera, !animate);
  if (st.run) { try { new Function("root", "ctx", st.run)(view.canvas, { animate, step: n }); } catch (e) { console.warn("step run failed", e); } }
  const moves = asList(st.move).map(m => move(view, m, animate));
  if (animate) await Promise.all(moves);
}

function finishScene(view) { setFocus(view, []); }

// Render scenes [first..k] statically up to (and including) step `upto` of scene k (-1 = before any step)
async function buildStatic(view, k, upto) {
  view.canvas.innerHTML = ""; view.css.textContent = ""; view.cam = null;
  const { first, list } = sceneChain(k);
  let div = null;
  for (let j = 0; j < list.length; j++) {
    const idx = first + j, sc = list[j];
    div = mountScene(view, sc, idx);
    const last = idx === k ? upto : sc.steps.length - 1;
    applyCamera(view, null, true);
    for (let i = 0; i <= last; i++) await applyStep(view, div, sc, i, false);
    if (idx !== k) finishScene(view);
  }
  return div;
}

// ======================= voice =======================
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const L = (S.lang || "en").toLowerCase(), base = L.split("-")[0];
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(base));
  const natural = (v) => /Natural|Online/i.test(v.name), region = (v) => v.lang.toLowerCase().replace("_", "-") === L;
  voice = vs.find(v => natural(v) && region(v)) || vs.find(natural) || vs.find(region) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let current = null;
function say(step) {
  return new Promise(resolve => {
    stopVoice();
    setCaption(step.text || "");
    const done = () => { current = null; resolve(); };
    if (step.src) {
      const a = new Audio(step.src); current = { audio: a };
      a.onended = done; a.onerror = () => speakTTS(step.text, done);
      a.play().catch(() => speakTTS(step.text, done));
    } else speakTTS(step.text, done);
  });
}
function speakTTS(text, done) {
  if (!("speechSynthesis" in window) || (!voice && speechSynthesis.getVoices().length === 0)) {
    const t = setTimeout(done, Math.max(1800, String(text).split(/\s+/).length * 380)); current = { timer: t }; return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice?.lang || S.lang || "en"; if (voice) u.voice = voice; u.rate = 1.02;
  u.onend = done; u.onerror = done; current = { utter: u };
  speechSynthesis.speak(u);
}
function stopVoice() {
  const c = current; current = null;
  if (c?.audio) { c.audio.onended = null; c.audio.pause(); }
  if (c?.timer) clearTimeout(c.timer);
  if (c?.utter) { c.utter.onend = null; speechSynthesis.cancel(); }
  if ("speechSynthesis" in window && speechSynthesis.paused) speechSynthesis.resume();
}

// ======================= playback =======================
function liveView() {
  if (!S.view) S.view = createView($("host"));
  return S.view;
}

async function playScene(k, { rebuild = true } = {}) {
  const run = ++S.runId;
  stopVoice();
  S.scene = k; S.step = 0; S.waiting = false;
  const sc = S.scenes[k];
  if (!sc) { updateChrome(); return; }
  const view = liveView();
  let div;
  const chained = sc.continue && !rebuild && view.canvas.querySelector(`.scene[data-scene="${k - 1}"]`);
  if (chained) {
    finishScene(view);
    div = mountScene(view, sc, k);
  } else {
    $("stage").classList.add("leaving"); await sleep(rebuild ? 0 : 250);
    if (run !== S.runId) return;
    div = await buildStatic(view, k, -1);
    $("stage").classList.remove("leaving");
  }
  report(); markPlanSection(true); updateChrome();
  for (let i = 0; i < sc.steps.length; i++) {
    if (run !== S.runId) return;
    S.step = i;
    const acts = applyStep(view, div, sc, i, true);
    await Promise.all([acts, say(sc.steps[i])]);
    await waitWhilePaused(run);
    if (run !== S.runId) return;
    await sleep(sc.steps[i].pause ?? 350);
  }
  if (run !== S.runId) return;
  finishScene(view);
  await sleep(800);
  if (run !== S.runId) return;
  nextOrWait(run);
}

function waitWhilePaused(run) { return new Promise(r => { const chk = () => (!S.paused || run !== S.runId) ? r() : setTimeout(chk, 150); chk(); }); }

function nextOrWait(run) {
  if (S.scene + 1 < S.scenes.length) { playScene(S.scene + 1, { rebuild: false }); return; }
  S.waiting = true; updateStatus();
  const chk = () => {
    if (run !== S.runId) return;
    if (S.scene + 1 < S.scenes.length) { S.waiting = false; playScene(S.scene + 1, { rebuild: false }); }
    else setTimeout(chk, 500);
  };
  chk();
}

function go(k) {
  if (k < 0 || k >= S.scenes.length) return;
  if (S.paused) { S.paused = false; updateChrome(); }
  playScene(k);
}

function report() { if (!window.DEMO) fetch(`position?i=${S.scene}`).catch(() => {}); }

// ======================= interface =======================
function setCaption(text, status = false) { const c = $("caption"); c.textContent = text; c.classList.toggle("status", status); }

function updateStatus() {
  if (!S.scenes.length) return setCaption("Claude is preparing the story…", true);
  if (S.paused) return setCaption("Paused. Press Space to resume.", true);
  if (S.waiting) {
    if (S.done) return setCaption("The end. Go back to the chat to approve the plan or ask for changes.", true);
    const next = S.outline?.scenes?.[S.scenes.length]?.title;
    return setCaption(next ? `Up next: ${next}…` : "Preparing the next scene…", true);
  }
}

function updateChrome() {
  const total = S.done ? S.scenes.length : Math.max(S.total || 0, S.scenes.length);
  const sc = S.scenes[S.scene];
  const KIND = { question: "Your question · ", correction: "Change · ", detail: "In detail · ", summary: "" };
  $("chapter").innerHTML = sc ? `<span>${S.scene + 1} / ${total}</span>${esc((KIND[sc.kind] || "") + (sc.title || ""))}` : "";
  const track = $("track");
  if (track.children.length !== total) track.innerHTML = Array.from({ length: total }, () => '<span class="seg"><i></i></span>').join("");
  [...track.children].forEach((el, i) => {
    el.classList.toggle("current", i === S.scene);
    el.classList.toggle("pending", i >= S.scenes.length);
    if (i !== S.scene) el.firstChild.style.transform = `scaleX(${i < S.scene ? 1 : 0})`;
  });
  $("toggle").setAttribute("aria-label", S.paused ? "Resume" : "Pause");
  $("toggle-icon").innerHTML = S.paused
    ? '<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>'
    : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
}

function tick() {
  const bar = $("track").children[S.scene]?.firstChild, sc = S.scenes[S.scene];
  if (bar && sc?.steps?.length) bar.style.transform = `scaleX(${Math.min(1, (S.step + (current ? .5 : 1)) / sc.steps.length)})`;
  requestAnimationFrame(tick);
}

function togglePause() {
  S.paused = !S.paused;
  if (S.paused) { if (current?.audio) current.audio.pause(); else if (current?.utter) speechSynthesis.pause(); updateStatus(); }
  else {
    if (current?.audio) current.audio.play(); else if (current?.utter) speechSynthesis.resume();
    const st = S.scenes[S.scene]?.steps[S.step]; if (st) setCaption(st.text);
  }
  updateChrome();
}
function toggleCaptions() { captions = !captions; setPref("plan-tour-cc", captions ? "on" : "off"); applyCaptions(); }

addEventListener("resize", () => { if (S.view) fitView(S.view); });
new ResizeObserver(() => { if (S.view) fitView(S.view); }).observe($("stage"));

// ======================= written plan =======================
const planUI = { open: false, md: null, version: null, pausedByPanel: false };
async function loadPlan(version) {
  if (planUI.version === version && planUI.md !== null) return;
  try {
    const md = window.DEMO ? window.DEMO.planText : await (await fetch(`plan.md?t=${Date.now()}`, { cache: "no-store" })).text();
    planUI.md = md; planUI.version = version;
    const body = $("plan-body");
    body.innerHTML = window.marked ? marked.parse(md, { gfm: true }) : `<pre>${esc(md)}</pre>`;
    body.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    markPlanSection(false);
  } catch { $("plan-body").innerHTML = '<p class="plan-empty">Could not load the plan.</p>'; }
}
function markPlanSection(scroll = true) {
  const body = $("plan-body");
  body.querySelectorAll(".here").forEach(el => el.classList.remove("here"));
  const ref = S.scenes[S.scene]?.plan;
  $("plan-where").textContent = ref ? `Scene ${S.scene + 1}: ${ref}` : "";
  if (!ref) return;
  const norm = (t) => t.replace(/[`*_]/g, "").trim().toLowerCase();
  const heads = [...body.querySelectorAll("h1,h2,h3,h4,h5,h6")];
  const h = heads.find(x => norm(x.textContent) === norm(ref)) || heads.find(x => norm(x.textContent).includes(norm(ref)));
  if (!h) return;
  const level = +h.tagName[1];
  h.classList.add("here");
  for (let el = h.nextElementSibling; el && !(/^H[1-6]$/.test(el.tagName) && +el.tagName[1] <= level); el = el.nextElementSibling) el.classList.add("here");
  if (scroll && planUI.open) h.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
}
function togglePlan(force) {
  const open = force ?? !planUI.open;
  if (open === planUI.open) return;
  planUI.open = open;
  $("plan").classList.toggle("open", open); $("plan").setAttribute("aria-hidden", String(!open));
  $("planbtn").setAttribute("aria-pressed", String(open)); document.body.classList.toggle("plan-open", open);
  if (open) {
    if (S.started && !S.paused) { togglePause(); planUI.pausedByPanel = true; }
    markPlanSection(true); $("plan-close").focus();
  } else {
    if (planUI.pausedByPanel && S.paused) togglePause();
    planUI.pausedByPanel = false; $("planbtn").focus();
  }
}
function syncPlan(plan) {
  const has = !!plan || !!window.DEMO?.planText;
  $("planbtn").classList.toggle("hidden", !has);
  if (has) loadPlan(plan?.updated ?? "demo");
}

// ======================= controls =======================
$("start").onclick = () => {
  S.started = true; $("intro").classList.add("hidden"); pickVoice();
  if (S.scenes.length) playScene(0); else updateStatus();
  $("toggle").focus();
};
$("prev").onclick = () => go(S.scene - 1);
$("next").onclick = () => go(S.scene + 1);
$("replay").onclick = () => go(S.scene);
$("toggle").onclick = togglePause;
$("cc").onclick = toggleCaptions;
$("planbtn").onclick = () => togglePlan();
$("plan-close").onclick = () => togglePlan(false);
document.addEventListener("keydown", (e) => {
  if (!S.started) { if (e.key === "Enter") $("start").click(); return; }
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight") go(S.scene + 1);
  else if (e.key === "ArrowLeft") go(S.scene - 1);
  else if (e.key === " ") { e.preventDefault(); togglePause(); }
  else if (e.key.toLowerCase() === "r") go(S.scene);
  else if (e.key.toLowerCase() === "c") toggleCaptions();
  else if (e.key.toLowerCase() === "p" && !$("planbtn").classList.contains("hidden")) togglePlan();
  else if (e.key === "Escape" && planUI.open) togglePlan(false);
});

// ======================= data =======================
function load(m) {
  syncPlan(m.plan);
  const newTour = S.tour !== m.tour;
  const prevLen = S.scenes.length;
  S.tour = m.tour; S.scenes = m.scenes || []; S.total = m.total; S.done = !!m.done; S.outline = m.outline;
  if (S.lang !== m.lang) { S.lang = m.lang || "en"; document.documentElement.lang = S.lang; pickVoice(); }
  if (newTour) {
    S.revision = m.revision ?? 0;
    if (S.started && S.scenes.length) playScene(0);
  } else if (S.revision !== (m.revision ?? 0)) {      // Claude rewound after a question or an adjustment
    S.revision = m.revision;
    const k = m.resumeAt ?? S.scene;
    if (S.started) {
      if (k < S.scenes.length) go(k);
      else { const run = ++S.runId; stopVoice(); S.scene = k - 1; nextOrWait(run); }
    }
  } else if (S.started && prevLen === 0 && S.scenes.length) playScene(0);
  updateChrome(); updateStatus();
}

// ======================= review mode: contact sheet + layout lint =======================
async function review() {
  document.body.classList.add("review");
  const r = await fetch(`manifest.json?t=${Date.now()}`, { cache: "no-store" });
  const m = await r.json();
  S.scenes = m.scenes || []; S.lang = m.lang || "en";
  let k;
  if (params.get("review") === "draft") {
    const d = await (await fetch(`draft.json?t=${Date.now()}`, { cache: "no-store" })).json();
    S.scenes = [...S.scenes.slice(0, d.index), d.scene];
    k = d.index;
  } else k = +params.get("review");
  const sc = S.scenes[k];
  const sheet = $("sheet"); sheet.classList.remove("hidden");
  const issues = [];
  await document.fonts.ready;
  for (let i = 0; i < sc.steps.length; i++) {
    const fig = document.createElement("figure");
    fig.innerHTML = `<div class="frame"></div><figcaption><b>${i + 1}</b>${esc(sc.steps[i].text)}</figcaption>`;
    sheet.appendChild(fig);
    const frame = fig.querySelector(".frame");
    const view = createView(frame, { static: true });
    await buildStatic(view, k, i);
    await sleep(60);   // timers advance in headless virtual time; animation frames may not
    lint(view, i + 1, issues);
  }
  $("lint").textContent = JSON.stringify({ scene: k + 1, steps: sc.steps.length, issues });
  document.title = "REVIEW_DONE";
}

function lint(view, step, issues) {
  const s = view.camScale || view.fit.s;
  const cr = view.canvas.getBoundingClientRect();
  const frame = view.host.getBoundingClientRect();
  const visible = (el) => {
    if (el.closest("[data-pre]")) return false;
    let n = el;
    while (n && n !== view.canvas) { const cs = getComputedStyle(n); if (cs.display === "none" || cs.visibility === "hidden" || +cs.opacity < .05) return false; n = n.parentElement; }
    return true;
  };
  const items = [...view.canvas.querySelectorAll("[data-el], .box, .card, .pill, .note, .chip, .code, .big, .title, svg text")]
    .filter(visible).filter(el => !el.matches(".big") || true);
  const name = (el) => el.id ? `#${el.id}` : el.dataset.el ? `[data-el=${el.dataset.el}]` : `${el.tagName.toLowerCase()}.${[...el.classList].filter(c => !c.startsWith("in-")).join(".")}`;
  const rects = items.map(el => { const r = el.getBoundingClientRect(); return { el, x1: (r.left - cr.left) / s, y1: (r.top - cr.top) / s, x2: (r.right - cr.left) / s, y2: (r.bottom - cr.top) / s, sx1: r.left - frame.left, sy1: r.top - frame.top, sx2: r.right - frame.left, sy2: r.bottom - frame.top }; });
  for (const r of rects) {

    const el = r.el;
    if (!(el instanceof SVGElement) && (el.scrollWidth > el.clientWidth + 2 || el.scrollHeight > el.clientHeight + 2) && getComputedStyle(el).overflow !== "visible")
      issues.push({ step, type: "overflow", el: name(el), msg: "its text doesn't fit inside it" });
    const fs = parseFloat(getComputedStyle(el).fontSize) || 0;
    if (fs && fs < 16 && (el.textContent || "").trim()) issues.push({ step, type: "small-text", el: name(el), msg: `font size ${fs}px is hard to read on a TV (use 18px or more)` });
  }
  for (let a = 0; a < rects.length; a++) for (let b = a + 1; b < rects.length; b++) {
    const A = rects[a], B = rects[b];
    if (A.el.contains(B.el) || B.el.contains(A.el) || A.el.matches(".big") || B.el.matches(".big")) continue;
    const ix = Math.min(A.x2, B.x2) - Math.max(A.x1, B.x1), iy = Math.min(A.y2, B.y2) - Math.max(A.y1, B.y1);
    if (ix <= 4 || iy <= 4) continue;
    const small = Math.min((A.x2 - A.x1) * (A.y2 - A.y1), (B.x2 - B.x1) * (B.y2 - B.y1)) || 1;
    if (ix * iy / small > .12) issues.push({ step, type: "overlap", el: `${name(A.el)} + ${name(B.el)}`, msg: "these elements overlap" });
  }
  // arrows crossing boxes they don't connect
  const boxes = rects.filter(r => r.el.matches(".box, .card, .code, [data-el]") && !r.el.matches("svg *"));
  view.canvas.querySelectorAll(".arrow").forEach(p => {
    if (!visible(p) || !p.getTotalLength) return;
    const L = p.getTotalLength(), ctm = p.getScreenCTM(); if (!ctm || !L) return;
    const hits = new Set();
    for (let i = 4; i <= 36; i++) {
      const pt = p.getPointAtLength(L * i / 40), sp = new DOMPoint(pt.x, pt.y).matrixTransform(ctm);
      const x = (sp.x - cr.left) / s, y = (sp.y - cr.top) / s;
      boxes.forEach(b => { if (x > b.x1 + 6 && x < b.x2 - 6 && y > b.y1 + 6 && y < b.y2 - 6) hits.add(b.el); });
    }
    hits.forEach(b => issues.push({ step, type: "arrow-through", el: `${name(p)} → ${name(b)}`, msg: "the arrow passes over an element in the middle of its path" }));
  });
  // dedupe same issue across steps
}

// ======================= start =======================
if (REVIEW) review();
else {
  requestAnimationFrame(tick);
  if (window.DEMO) load(window.DEMO);
  else {
    const poll = async () => {
      try { const r = await fetch(`manifest.json?t=${Date.now()}`, { cache: "no-store" }); if (r.ok) load(await r.json()); } catch {}
      setTimeout(poll, 1000);
    };
    poll();
  }
}
</script>
